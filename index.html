<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SFB Arcade</title>
<meta name="theme-color" content="#252478">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; font-family: 'Prompt', -apple-system, system-ui, sans-serif; background: #fbf9f4; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: 'Prompt', system-ui, sans-serif; }
  input, select { font-family: 'Prompt', system-ui, sans-serif; }

  /* Phone-shaped viewport on desktop; full-width on mobile */
  #root {
    width: 100%;
    height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    background: #fbf9f4;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.08);
  }
  @media (max-width: 480px) {
    #root { box-shadow: none; max-width: 100%; }
    body { background: #fbf9f4; }
  }
  @media (min-width: 481px) {
    body {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: linear-gradient(135deg, #e0dffa 0%, #ffe1de 50%, #dcf0ec 100%);
    }
    #root { height: min(900px, 100vh); border-radius: 24px; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#e0dffa"/>
  <ellipse cx="100" cy="125" rx="55" ry="48" fill="#8a5530"/>
  <ellipse cx="100" cy="78" rx="65" ry="11" fill="#ffd84a"/>
  <path d="M 50 76 Q 100 32 150 76 Z" fill="#ffd84a"/>
  <ellipse cx="82" cy="115" rx="7" ry="9" fill="#2a1810"/>
  <ellipse cx="118" cy="115" rx="7" ry="9" fill="#2a1810"/>
  <ellipse cx="100" cy="135" rx="6" ry="5" fill="#ff8a9a"/>
  <text x="100" y="180" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#252478">SFB Arcade</text>
</svg>
</template>

<div id="root"></div>

<script type="text/babel" src="arcade-config.jsx"></script>
<script type="text/babel" src="arcade-shared.jsx"></script>
<script type="text/babel" src="arcade-games.jsx"></script>
<script type="text/babel" src="arcade-api.jsx"></script>
<script type="text/babel" src="arcade-export.jsx"></script>
<script type="text/babel" src="arcade-mobile-admin.jsx"></script>
<script type="text/babel" src="arcade-mobile.jsx"></script>

<script type="text/babel">
const { MobileApp } = window;
ReactDOM.createRoot(document.getElementById('root')).render(<MobileApp startScreen="login" homeStyle="grid" />);
</script>
</body>
</html>
